name: Validate and publish GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build and test dependencies (no servers)
        run: |
          pip install -r backend/requirements.lock
          npm ci --prefix frontend
      - name: Generate allowlisted public data and isolated Python references
        run: python scripts/prepare_pages.py --references
      - name: Verify browser/backend parity and frontend regressions
        env:
          PAGES_PARITY: '1'
        run: npm test --prefix frontend
      - name: Typecheck and build static edition
        run: npm run build:pages --prefix frontend
      - name: Audit artifact paths, data integrity and allowlist
        run: python scripts/check_pages.py
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: frontend/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy static artifact
        id: deployment
        uses: actions/deploy-pages@v4
