[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "it-career-graph-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3", "SQLAlchemy>=2.0.35,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "networkx>=3.3,<4", "numpy>=1.26,<3", "pandas>=2.2,<3", "python-multipart>=0.0.18"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
nlp = ["sentence-transformers>=3", "openai>=1", "pdfplumber>=0.11", "python-docx>=1.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
"app.research" = ["*.json"]
